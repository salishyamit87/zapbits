<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - ZapBits</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f5f5f5; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        
        .login-container { background: white; padding: 2rem; border-radius: 10px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 100%; max-width: 400px; }
        .logo { text-align: center; color: #0066ff; font-size: 1.5rem; font-weight: bold; margin-bottom: 1.5rem; }
        .social-buttons { display: flex; flex-direction: column; gap: 0.8rem; margin-bottom: 1.5rem; }
        .social-btn { padding: 12px; border: 1px solid #ddd; border-radius: 5px; background: white; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; font-weight: 500; }
        .social-btn:hover { background: #f9f9f9; }
        .divider { text-align: center; margin: 1.5rem 0; color: #666; position: relative; }
        .divider::before { content: ''; position: absolute; left: 0; top: 50%; width: 45%; height: 1px; background: #ddd; }
        .divider::after { content: ''; position: absolute; right: 0; top: 50%; width: 45%; height: 1px; background: #ddd; }
        
        .form-group { margin-bottom: 1rem; }
        .form-group input { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 5px; font-size: 1rem; }
        .submit-btn { width: 100%; padding: 12px; background: #0066ff; color: white; border: none; border-radius: 5px; font-size: 1rem; font-weight: bold; cursor: pointer; }
        .submit-btn:hover { background: #0052cc; }
        .submit-btn:disabled { background: #ccc; cursor: not-allowed; }
        .login-link { text-align: center; margin-top: 1.5rem; }
        .login-link a { color: #0066ff; text-decoration: none; }
        
        .alert { padding: 10px; border-radius: 5px; margin-bottom: 1rem; text-align: center; }
        .alert-success { background: #e8f5e8; color: #00cc00; border: 1px solid #00cc00; }
        .alert-error { background: #ffe8e8; color: #ff4444; border: 1px solid #ff4444; }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo">ZapBits</div>
        
        <div id="alertMessage"></div>
        
        <div class="social-buttons">
            <button class="social-btn" onclick="signInWithGoogle()">
                <span>Continue with Google</span>
            </button>
            <button class="social-btn" onclick="signInWithGitHub()">
                <span>Continue with GitHub</span>
            </button>
            <button class="social-btn" onclick="signInWithMicrosoft()">
                <span>Continue with Microsoft</span>
            </button>
        </div>
        
        <div class="divider">or</div>
        
        <form id="signupForm">
            <div class="form-group">
                <input type="email" placeholder="Email address" required id="email">
            </div>
            <div class="form-group">
                <input type="password" placeholder="Password" required id="password">
            </div>
            <button type="submit" class="submit-btn" id="submitBtn">Create Account</button>
        </form>
        
        <div class="login-link">
            Already have an account? <a href="login.html">Sign in</a>
        </div>
    </div>

    <script>
        // Headscale API Configuration - DIRECT API CALLS
        const HEADSCALE_API = 'https://headscale.publicvm.com/api/v1';
        const API_KEY = 'Gib3hJr.WbZDm1n3YvRFU2T6uLStRteWmp4Wh4J2';

        function showAlert(message, type) {
            const alertDiv = document.getElementById('alertMessage');
            alertDiv.innerHTML = `<div class="alert alert-${type}">${message}</div>`;
            setTimeout(() => alertDiv.innerHTML = '', 5000);
        }

        // Signup form handler - DIRECT API CALLS
        document.getElementById('signupForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const submitBtn = document.getElementById('submitBtn');
            
            try {
                submitBtn.textContent = 'Creating Account...';
                submitBtn.disabled = true;

                // Create username from email
                const username = email.split('@')[0].toLowerCase().replace(/[^a-z0-9]/g, '');
                
                console.log('Creating user:', username, email);

                // Create user in Headscale DIRECTLY
                const response = await fetch(`${HEADSCALE_API}/user`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${API_KEY}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        name: username,
                        email: email
                    })
                });
                
                console.log('Response status:', response.status);
                
                if (response.ok) {
                    const userData = await response.json();
                    console.log('User created:', userData);
                    
                    // Store user info locally
                    const localUserData = {
                        id: userData.id,
                        email: email,
                        name: userData.name,
                        createdAt: new Date().toISOString(),
                        headscaleUser: userData
                    };
                    
                    localStorage.setItem('zapbits_user', JSON.stringify(localUserData));
                    
                    showAlert('✅ Account created successfully in Headscale! Redirecting...', 'success');
                    setTimeout(() => window.location.href = 'dashboard.html', 2000);
                } else {
                    const errorText = await response.text();
                    console.error('API Error:', errorText);
                    throw new Error(errorText || 'Failed to create user');
                }
                
            } catch (error) {
                console.error('Signup error:', error);
                showAlert('❌ Signup failed: ' + error.message, 'error');
                submitBtn.textContent = 'Create Account';
                submitBtn.disabled = false;
            }
        });

        function signInWithGoogle() {
            showAlert('Google Sign Up - Coming Soon', 'error');
        }
        
        function signInWithGitHub() {
            showAlert('GitHub Sign Up - Coming Soon', 'error');
        }
        
        function signInWithMicrosoft() {
            showAlert('Microsoft Sign Up - Coming Soon', 'error');
        }
    </script>
</body>
</html>
