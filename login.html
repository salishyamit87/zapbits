<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - ZapBits</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f5f5f5; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        
        .login-container { background: white; padding: 2rem; border-radius: 10px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 100%; max-width: 400px; }
        .logo { text-align: center; color: #0066ff; font-size: 1.5rem; font-weight: bold; margin-bottom: 1.5rem; }
        .social-buttons { display: flex; flex-direction: column; gap: 0.8rem; margin-bottom: 1.5rem; }
        .social-btn { padding: 12px; border: 1px solid #ddd; border-radius: 5px; background: white; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; font-weight: 500; }
        .social-btn:hover { background: #f9f9f9; }
        .divider { text-align: center; margin: 1.5rem 0; color: #666; position: relative; }
        .divider::before { content: ''; position: absolute; left: 0; top: 50%; width: 45%; height: 1px; background: #ddd; }
        .divider::after { content: ''; position: absolute; right: 0; top: 50%; width: 45%; height: 1px; background: #ddd; }
        
        .form-group { margin-bottom: 1rem; }
        .form-group input { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 5px; font-size: 1rem; }
        .submit-btn { width: 100%; padding: 12px; background: #0066ff; color: white; border: none; border-radius: 5px; font-size: 1rem; font-weight: bold; cursor: pointer; }
        .submit-btn:hover { background: #0052cc; }
        .submit-btn:disabled { background: #ccc; cursor: not-allowed; }
        .signup-link { text-align: center; margin-top: 1.5rem; }
        .signup-link a { color: #0066ff; text-decoration: none; }
        
        .alert { padding: 10px; border-radius: 5px; margin-bottom: 1rem; text-align: center; }
        .alert-success { background: #e8f5e8; color: #00cc00; border: 1px solid #00cc00; }
        .alert-error { background: #ffe8e8; color: #ff4444; border: 1px solid #ff4444; }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo">ZapBits</div>
        
        <div id="alertMessage"></div>
        
        <div class="social-buttons">
            <button class="social-btn" onclick="loginWithGoogle()">
                <span>Continue with Google</span>
            </button>
            <button class="social-btn" onclick="loginWithGitHub()">
                <span>Continue with GitHub</span>
            </button>
            <button class="social-btn" onclick="loginWithMicrosoft()">
                <span>Continue with Microsoft</span>
            </button>
        </div>
        
        <div class="divider">or</div>
        
        <form id="loginForm">
            <div class="form-group">
                <input type="email" placeholder="Email address" required id="email">
            </div>
            <div class="form-group">
                <input type="password" placeholder="Password" required id="password">
            </div>
            <button type="submit" class="submit-btn" id="submitBtn">Sign In</button>
        </form>
        
        <div class="signup-link">
            Don't have an account? <a href="signup.html">Sign up</a>
        </div>
    </div>

    <script>
        // Netlify Functions URLs
        const NETLIFY_FUNCTIONS_URL = '/.netlify/functions';

        function showAlert(message, type) {
            const alertDiv = document.getElementById('alertMessage');
            alertDiv.innerHTML = `<div class="alert alert-${type}">${message}</div>`;
            setTimeout(() => alertDiv.innerHTML = '', 5000);
        }

        // Login form handler - REAL API INTEGRATION
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const submitBtn = document.getElementById('submitBtn');
            
            try {
                submitBtn.textContent = 'Signing In...';
                submitBtn.disabled = true;

                // Check user via Netlify function
                const username = email.split('@')[0].toLowerCase();
                const response = await fetch(`${NETLIFY_FUNCTIONS_URL}/get-user?username=${encodeURIComponent(username)}`);
                const result = await response.json();
                
                if (result.success) {
                    // Store user info locally
                    const localUserData = {
                        id: result.user.id,
                        email: email,
                        name: result.user.name,
                        createdAt: new Date().toISOString(),
                        headscaleUser: result.user
                    };
                    
                    localStorage.setItem('zapbits_user', JSON.stringify(localUserData));
                    
                    showAlert('✅ Login successful! Redirecting...', 'success');
                    setTimeout(() => window.location.href = 'dashboard.html', 2000);
                } else {
                    throw new Error(result.message);
                }
                
            } catch (error) {
                console.error('Login error:', error);
                showAlert('❌ Login failed: ' + error.message, 'error');
                submitBtn.textContent = 'Sign In';
                submitBtn.disabled = false;
            }
        });

        function loginWithGoogle() {
            showAlert('Google Login - Coming Soon', 'error');
        }
        
        function loginWithGitHub() {
            showAlert('GitHub Login - Coming Soon', 'error');
        }
        
        function loginWithMicrosoft() {
            showAlert('Microsoft Login - Coming Soon', 'error');
        }
    </script>
</body>
</html>
